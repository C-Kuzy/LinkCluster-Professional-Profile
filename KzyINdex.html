<!DOCTYPE html>
<html lang = "en">

<!--img src = "https://drive.google.com/file/d/1DpJGM2jaler846HUHLkBq42wIZLN7Xl-/view?usp=drive_link" alt = "My Image"> -->
<!-- ツ ツ ツ  -->

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ProLinkCluster</title>
    <link rel="icon" href="./lib/assets/LinkCluster.png" type="web-icon">

    <!-- Load Three.js first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
    
    <!-- Load universal transition system -->
    <script type="module" src="lib/effects/transitions.js"></script>
    
    <!-- Load visual effects module -->
    <script type="module" src="lib/effects/visual.js"></script>

    <!-- Load core rendering module -->
    <script type="module" defer src="lib/core/renderer.js"></script>

    <!-- Load typewriter effect module -->
    <script type="module" defer src="lib/effects/typewriter.js"></script>
    
    <!-- Load EULA and jet-away animation module -->
    <script type="module" defer src="lib/effects/eula.js"></script>

    <!-- Application styles -->
    <link rel="stylesheet" href="lib/design/app.css" />
</head>

<body>
    <div id="breeze-container"></div>
    <main>  
        <div class = "logoContainer">
            <img class = "logo"
                 src= "https://cdn1.iconfinder.com/data/icons/competition-4/512/Competition-match-rival-13-64.png"                           
                 alt = "Click Link"/>
        </div>
        <div class = "greetings">
            <h1 id="name-text"></h1>
        </div>
        <div class = "about">
            <div id="description-text"></div>
        </div>
        <div class = "LinkCluster Links" 
             id = "links">
        </div>
        
        <!-- Footer with EULA Link -->
        <footer class="enhanced-footer">
            <p>Connor Kouznetsov — <a href="#" class="eula-link" id="eulaLink">EULA</a> — © 2026</p>
        </footer>
    </main>
    
    <!-- Universal transition overlay for all link animations -->
    <div class="transition-overlay" id="transitionOverlay"></div>
    
    <!-- EULA Modal - Content loaded dynamically from lib/data/EULA.html -->
    <div class="eula-modal" id="eulaModal">
        <div class="eula-content">
            <!-- Content will be loaded by eula.js -->
        </div>
    </div>
    </div>
</body>
</html>
